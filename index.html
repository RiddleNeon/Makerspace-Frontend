<div id="auth2" hidden>
  <div id="auth-backdrop"></div>

  <div id="auth-content">

    <div id="auth-popup">
      <h2>Login</h2>

      <div id="auth-input-section">
        <div class="auth-field">
          <input id="email" name="email" type="email" placeholder=" " autocomplete="email" />
          <label for="email">Email Address</label>
        </div>

        <div class="auth-field">
          <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" />
          <label for="password">Password</label>
        </div>

        <button type="submit" id="auth-login-button">Login</button>
      </div>

      <p>
        Noch kein Account?
        <button type="button" id="register-button">Registrieren</button>
      </p>
