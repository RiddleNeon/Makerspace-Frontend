<div id="filament-decide-page">
  <textarea name="Idea" id="idea-input-for-filament-type" rows="6" style="width: 50%;"
    placeholder="Beschreibe deine Idee"></textarea>

  <button type="submit" class="btn" id="idea-submit-button">
    Ask
  </button>

  <div id="result-box">
    <div>Filament Typ: <span id="filament-result"></span></div>
    <span id="safety-box"></span>
  </div>
  <span id="error-box" style="color: red;"></span>
</div>
